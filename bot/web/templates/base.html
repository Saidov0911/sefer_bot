<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · Sefer admin</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
{% if request.session.get("admin") %}
<header class="topbar">
  <a class="brand" href="/">Sefer <span>admin</span></a>
  <nav>
    <a href="/" class="{{ 'active' if path == '/' }}">Bosh sahifa</a>
    <a href="/applications" class="{{ 'active' if path.startswith('/applications') }}">Arizalar</a>
    <a href="/users" class="{{ 'active' if path.startswith('/users') }}">Foydalanuvchilar</a>
    <a href="/broadcast" class="{{ 'active' if path.startswith('/broadcast') }}">Ommaviy xabar</a>
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">Chiqish</button>
  </form>
</header>
{% endif %}
<main class="container">
  {% if flash %}<div class="flash flash-{{ flash.kind }}">{{ flash.message }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
