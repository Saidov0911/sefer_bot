services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /app/data/bot.db
      GOOGLE_CREDENTIALS_FILE: /app/credentials.json
      WEB_HOST: 0.0.0.0
      # Port faqat 127.0.0.1 ga ochiq, ya'ni konteynerga faqat serverdagi nginx ulanadi
      # (Docker gateway IP'si orqali). nginx X-Forwarded-For ni almashtirib yozadi.
      WEB_FORWARDED_ALLOW_IPS: "*"
    ports:
      # Web admin panel. Faqat serverning o'zidan ochiladi — tashqaridan nginx (HTTPS) orqali: deploy/nginx/
      # Port band bo'lsa .env dagi WEB_PORT ni o'zgartiring (bu faylni tahrirlash shart emas),
      # so'ng nginx dagi proxy_pass ni ham o'sha portga moslang
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:
