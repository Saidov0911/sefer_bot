# Sefer web admin panel — nginx reverse proxy (HTTPS).
#
# admin.example.uz ni o'z domeningizga almashtiring (sed buyrug'i README'da).
# O'rnatish tartibi: README.md → "Domen va HTTPS (nginx)".
# Sertifikat avval olinishi kerak, aks holda `nginx -t` xato beradi.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.uz;

    # certbot sertifikatni yangilashda o'z vaqtinchalik location'ini qo'shadi,
    # shuning uchun redirect server darajasida emas, location ichida
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.uz;

    ssl_certificate     /etc/letsencrypt/live/admin.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sefer_admin_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Panel faqat kichik formalar qabul qiladi
    client_max_body_size 1m;

    # Ixtiyoriy: panelga faqat ma'lum IP'lardan kirish (ofis, VPN)
    # allow 203.0.113.10;
    # deny all;

    location / {
        # Port .env dagi WEB_PORT bilan bir xil bo'lishi shart (standart 8080)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Qo'shib emas, ALMASHTIRIB yozamiz ($proxy_add_x_forwarded_for emas):
        # aks holda mijoz soxta IP yuborib, login urinishlari cheklovini chetlab o'tadi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CV fayllar Telegram'dan olinib uzatiladi — biroz vaqt olishi mumkin
        proxy_read_timeout 120s;
    }
}
